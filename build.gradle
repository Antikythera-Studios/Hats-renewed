plugins {
    id "dev.architectury.loom-no-remap" version "${architectury_loom_version}" apply false
    id "architectury-plugin" version "${architectury_plugin_version}"
    id "com.gradleup.shadow" version "8.3.6" apply false
    id "me.modmuss50.mod-publish-plugin" version "${mod_publish_version}"
}

architectury {
    minecraft = project.mc_version
}

def mcParts = project.mc_version.split('\\.')
def mcMajor = mcParts[0] == "1" && mcParts.length > 1 ? mcParts[1] : mcParts[0]

allprojects {
    group = project.mod_group
    version = "${mcMajor}.${project.mod_version}-mc${project.mc_version}"
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "${project.mod_name}"
    }

    repositories {
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.fabricmc.net/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.mc_version}"
    }

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    processResources {
        inputs.property "version", project.version
        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }
}

// Unified multi-platform publishing (Modrinth + CurseForge + Discord) via mod-publish-plugin.
apply from: "$rootDir/gradle/publishing.gradle"
